<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Zain AI</title>

  <style>
    body{
      margin:0;
      font-family:Arial, sans-serif;
      background:#0f0f0f;
      color:white;
      display:flex;
      flex-direction:column;
      height:100vh;
    }

    .header{
      padding:15px;
      background:#1a1a1a;
      text-align:center;
      font-size:20px;
      font-weight:bold;
      border-bottom:1px solid #333;
    }

    .chat-box{
      flex:1;
      overflow-y:auto;
      padding:15px;
      display:flex;
      flex-direction:column;
      gap:10px;
    }

    .msg{
      max-width:80%;
      padding:10px 14px;
      border-radius:12px;
      word-wrap:break-word;
    }

    .user{
      align-self:flex-end;
      background:#2563eb;
    }

    .bot{
      align-self:flex-start;
      background:#262626;
    }

    .input-area{
      display:flex;
      padding:10px;
      background:#1a1a1a;
      border-top:1px solid #333;
    }

    input{
      flex:1;
      padding:12px;
      border:none;
      outline:none;
      border-radius:10px;
      background:#262626;
      color:white;
      font-size:15px;
    }

    button{
      margin-left:10px;
      padding:12px 18px;
      border:none;
      border-radius:10px;
      background:#2563eb;
      color:white;
      cursor:pointer;
      font-weight:bold;
    }

    button:hover{
      opacity:0.8;
    }
  </style>
</head>
<body>

  <div class="header">
    Zain AI 🤓
  </div>

  <div class="chat-box" id="chatBox"></div>

  <div class="input-area">
    <input type="text" id="prompt" placeholder="Tulis pesan..." />
    <button onclick="sendMessage()">Kirim</button>
  </div>

  <script>
    const chatBox = document.getElementById("chatBox");

    function addMessage(text, sender){
      const div = document.createElement("div");
      div.className = `msg ${sender}`;
      div.innerText = text;
      chatBox.appendChild(div);

      chatBox.scrollTop = chatBox.scrollHeight;
    }

    function extractText(data) {
      // Cek berbagai struktur response
      if (typeof data === 'string') return data;
      if (data.result && typeof data.result === 'string') return data.result;
      if (data.message && typeof data.message === 'string') return data.message;
      if (data.data && typeof data.data === 'string') return data.data;
      if (data.data && data.data.result && typeof data.data.result === 'string') return data.data.result;
      if (data.data && data.data.message && typeof data.data.message === 'string') return data.data.message;
      if (data.response && typeof data.response === 'string') return data.response;
      
      // Debug: log struktur response
      console.log("API Response:", data);
      return "Maaf, format response tidak sesuai";
    }

    async function sendMessage(){
      const input = document.getElementById("prompt");
      const text = input.value.trim();

      if(!text) return;

      addMessage(text, "user");
      input.value = "";

      addMessage("Ngetik bentar anjing...", "bot");

      try{
        const response = await fetch(
          `https://api-nanzz.my.id/docs/api/ai/chat-gpt.php?text=${encodeURIComponent(text)}&model=qwen`
        );

        const data = await response.json();

        const lastBot = document.querySelector(".msg.bot:last-of-type");
        if(lastBot) lastBot.remove();

        let hasil = extractText(data);

        addMessage(hasil, "bot");

      }catch(err){
        const lastBot = document.querySelector(".msg.bot:last-of-type");
        if(lastBot) lastBot.remove();

        addMessage("API nya mokad goblok 💀", "bot");
        console.error(err);
      }
    }
  </script>

</body>
</html>
