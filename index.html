<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chat Gemma</title>

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

html,body{
  width:100%;
  height:100%;
}

body{
  font-family:Arial,sans-serif;
  background:#0f0f0f;
  color:white;
  display:flex;
  flex-direction:column;
  overflow:hidden;
}

.header{
  padding:15px;
  background:#1a1a1a;
  text-align:center;
  font-size:20px;
  font-weight:bold;
  border-bottom:1px solid #333;
  flex-shrink:0;
}

.chat-box{
  flex:1;
  overflow-y:auto;
  padding:15px;
  display:flex;
  flex-direction:column;
  gap:10px;
  min-height:0;
}

.msg{
  max-width:80%;
  padding:10px 14px;
  border-radius:12px;
  word-wrap:break-word;
  white-space:pre-wrap;
}

.user{
  align-self:flex-end;
  background:#2563eb;
}

.bot{
  align-self:flex-start;
  background:#262626;
}

.input-area{
  display:flex;
  padding:10px;
  background:#1a1a1a;
  border-top:1px solid #333;
  gap:10px;
  flex-shrink:0;
}

input{
  flex:1;
  padding:12px;
  border:none;
  outline:none;
  border-radius:10px;
  background:#262626;
  color:white;
  font-size:15px;
}

button{
  padding:12px 18px;
  border:none;
  border-radius:10px;
  background:#2563eb;
  color:white;
  cursor:pointer;
  font-weight:bold;
}

button:hover{
  opacity:.8;
}
</style>
</head>
<body>

<div class="header">
  Chat Gemma 🤖
</div>

<div class="chat-box" id="chatBox"></div>

<div class="input-area">
  <input
    type="text"
    id="prompt"
    placeholder="Tulis pesan..."
  >
  <button onclick="sendMessage()">
    Kirim
  </button>
</div>

<script>

const chatBox = document.getElementById("chatBox");
const inputField = document.getElementById("prompt");

let sessionId =
localStorage.getItem("gemma_session") || "";

function addMessage(text,sender){
  const div = document.createElement("div");

  div.className = `msg ${sender}`;
  div.textContent = text;

  chatBox.appendChild(div);
  chatBox.scrollTop = chatBox.scrollHeight;

  return div;
}

async function sendMessage(){

  const text = inputField.value.trim();

  if(!text) return;

  addMessage(text,"user");
  inputField.value = "";

  const loading =
  addMessage("Gemma lagi mikir...","bot");

  try{

    const response = await fetch(
      "https://api-chat.workers.dev/chat",
      {
        method:"POST",
        headers:{
          "Content-Type":"application/json"
        },
        body:JSON.stringify({
          text,
          sessionId
        })
      }
    );

    const data = await response.json();

    loading.remove();

    if(data.sessionId){
      sessionId = data.sessionId;

      localStorage.setItem(
        "gemma_session",
        sessionId
      );
    }

    addMessage(
      data.result ||
      data.reply ||
      "Tidak ada balasan.",
      "bot"
    );

  }catch(err){

    loading.remove();

    addMessage(
      "Worker lagi ngambek 💀",
      "bot"
    );

    console.error(err);
  }
}

inputField.addEventListener(
  "keypress",
  (e)=>{
    if(e.key==="Enter"){
      sendMessage();
    }
  }
);

window.addEventListener(
  "DOMContentLoaded",
  ()=>{
    addMessage(
      "Halo 👋 Aku Chat Gemma. Ada yang mau dibahas?",
      "bot"
    );
  }
);

  </script>

</body>
</html>
